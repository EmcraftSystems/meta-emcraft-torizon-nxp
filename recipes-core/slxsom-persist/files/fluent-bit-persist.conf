# Provisioning creates /etc/fluent-bit/enabled, which a signed image loses at
# the next boot; slxsom-fluent-bit-save.path keeps a copy under /var. The
# empty line clears the unit's own condition, so either file starts it.
[Unit]
ConditionPathExists=
ConditionPathExists=|/etc/fluent-bit/enabled
ConditionPathExists=|/var/rootdirs/etc/fluent-bit/enabled
