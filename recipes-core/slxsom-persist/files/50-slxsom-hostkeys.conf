# On a signed image /etc is reset at every boot. The host keys are kept under
# /var/rootdirs/etc/ssh instead, as Toradex's "Root Filesystem Protection"
# shows, so that the device keeps its SSH identity. sshd_check_keys generates
# each key here at the first boot that does not find it.
HostKey /var/rootdirs/etc/ssh/ssh_host_rsa_key
HostKey /var/rootdirs/etc/ssh/ssh_host_ecdsa_key
HostKey /var/rootdirs/etc/ssh/ssh_host_ed25519_key
