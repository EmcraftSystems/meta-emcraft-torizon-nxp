#@TYPE: Machine
#@NAME: Emcraft SLX-SOM
#@SOC: i.MX6SX
#@DESCRIPTION: Emcraft i.MX 6SoloX system-on-module on the LCD-SLX-SOM-BSB baseboard: U-Boot in the NAND, Torizon OS on the SD card
#@MAINTAINER: Emcraft Systems <customer-service@emcraft.com>

MACHINEOVERRIDES =. "mx6sx:"

IMX_DEFAULT_BSP = "nxp"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv7a/tune-cortexa9.inc

UBOOT_MAKE_TARGET = "u-boot.imx"
UBOOT_SUFFIX = "imx"

UBOOT_CONFIG ??= "nand"
UBOOT_CONFIG[nand] = "imx6sx_slx_som_defconfig"

# Where meta-toradex-torizon's u-boot-imx append installs torizon-imx6sx.env
UBOOT_ENV_BOARD_DIR = "board/emcraft/slx-som"

KERNEL_DEVICETREE = "nxp/imx/imx6sx-slx-som.dtb"

SERIAL_CONSOLES = "115200;ttymxc0"

# A signed build: the build directory adds meta-toradex-security and
# meta-security and sets INHERIT += "torizon-signed", which gives the
# tdx-signed, cfs-support and cfs-signed overrides. The keys are where
# Toradex's classes look by default, keys/cst, keys/fit and keys/ostree in the
# build directory.
TDX_IMX_HAB_CST_BUILD_FROM_SOURCE:tdx-signed = "1"
# The serial downloader (uuu) writes the DCD to OCRAM itself and clears the
# IVT's DCD pointer, which the NAND image's signature covers. A signed build
# adds a second U-Boot, sdp, signed over the cleared pointer and the DCD
# block. The security layer passes TDX_IMX_HAB_SDP_CONFIGS to the signing on
# the 6ULL and 7 only. nand stays last, so u-boot.imx remains the NAND image.
UBOOT_CONFIG:tdx-signed = "sdp nand"
UBOOT_CONFIG[sdp] = "imx6sx_slx_som_sdp_defconfig"
TDX_IMX_HAB_SDP_CONFIGS:tdx-signed = "sdp"
TDX_IMX_HAB_SDP_CONFIGS_INTERNAL:mx6sx-generic-bsp = "${TDX_IMX_HAB_SDP_CONFIGS}"
# The U-Boot hardening's kernel command-line protection compares bootargs with
# an overlay in the FIT. Torizon builds it in device-tree-overlays recipes this
# build does not have, so the kernel builds it (linux-imx-slx-som-signed.inc),
# under the name the FIT class gives its configuration.
KERNEL_DEVICETREE:append:tdx-signed = " nxp/imx/imx6sx-slx-som-secboot-kargs_overlay.dtbo"
TDX_SECBOOT_KARGS_OVERLAY:tdx-signed = "nxp_imx_${MACHINE}-secboot-kargs_overlay"
# bootm applies an overlay configuration only to a base tree loaded out of the
# FIT, so the device tree gets fdt_addr_r, 8 MiB below the FIT.
UBOOT_DTB_LOADADDRESS:tdx-signed = "0x83000000"
# The FIT's configurations are named after the device trees with their
# nxp/imx/ directory; U-Boot's fdtfile names the one to boot. The board's
# environment sets fdt_high to 0xffffffff, which would boot the tree in place
# inside the FIT: clearing it makes bootm copy the tree to memory of its own.
KERNEL_DTB_PREFIX:tdx-signed = "nxp/imx/"
UENV_EXTRA_CONFIGS:tdx-signed = "env set fdt_file ${fdtfile}; env set fdt_high"
