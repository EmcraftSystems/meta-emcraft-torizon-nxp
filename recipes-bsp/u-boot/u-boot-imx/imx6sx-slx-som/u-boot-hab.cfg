CONFIG_IMX_HAB=y
# CONFIG_IMX_HAB selects FSL_CAAM, and with it the CAAM's SHA for hashing a
# FIT's images. The CAAM's job ring is set up by arch_misc_init(), which the
# SABRE-SD target selects and this board's does not: without it the first
# hash of a FIT image never finishes. RNG_SELF_TEST, also the SABRE-SD's,
# instantiates the RNG after the boot ROM's self-test.
CONFIG_ARCH_MISC_INIT=y
CONFIG_RNG_SELF_TEST=y
# The hardening's kernel command-line overlay is a FIT configuration that
# bootm applies to the device tree.
CONFIG_OF_LIBFDT_OVERLAY=y
